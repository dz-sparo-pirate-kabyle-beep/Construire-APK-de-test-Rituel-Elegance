name: Rituel Elegance 0.4.2 - SANS PUBLICITE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/construire-rituel-0-4-0.yml"
      - "release/prepare_v03.py"

permissions:
  contents: read

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Source GitHub
        uses: actions/checkout@v4

      - name: Extraire projet Flutter
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "rituel_elegance_site_complet_android (2).zip" -d extrait
          test -f extrait/rituel_elegance_site_complet_android/lib/main.dart

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generer Android
        working-directory: extrait/rituel_elegance_site_complet_android
        run: flutter create --project-name rituel_elegance --org fr.rituelelegance --platforms android .

      - name: Identifiant Android inchangé
        working-directory: extrait/rituel_elegance_site_complet_android
        run: python3 scripts/prepare_android.py --package fr.rituelelegance.boutique

      - name: Base 0.3.0
        run: python3 release/prepare_v03.py

      - name: Version 0.4.2 sans SDK publicitaire
        working-directory: extrait/rituel_elegance_site_complet_android
        run: |
          python3 -c 'from pathlib import Path; p=Path("pubspec.yaml"); s=p.read_text(); assert "version: 0.3.0+3" in s; assert "google_mobile_ads:" not in s; p.write_text(s.replace("version: 0.3.0+3", "version: 0.4.2+6", 1))'
          ! grep -q "com.google.android.gms.ads.APPLICATION_ID" android/app/src/main/AndroidManifest.xml

      - name: Installer dependances
        working-directory: extrait/rituel_elegance_site_complet_android
        run: flutter pub get

      - name: Verifier code Flutter
        working-directory: extrait/rituel_elegance_site_complet_android
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Generer icone Android
        working-directory: extrait/rituel_elegance_site_complet_android
        run: dart run flutter_launcher_icons

      - name: Compiler bundle 0.4.2 code 6
        working-directory: extrait/rituel_elegance_site_complet_android
        run: flutter build appbundle --release

      - name: Publier AAB pour signature locale
        uses: actions/upload-artifact@v4
        with:
          name: Rituel-Elegance-0.4.2-SANS-PUBLICITE-AAB
          path: extrait/rituel_elegance_site_complet_android/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
