name: Rituel Elegance 0.3.0 - Mise a jour Alpha

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/construire-rituel-0-3-0.yml"
      - "release/prepare_v03.py"

permissions:
  contents: read

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Recuperer depot GitHub
        uses: actions/checkout@v4

      - name: Extraire le projet Flutter initial
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "rituel_elegance_site_complet_android (2).zip" -d extrait
          test -f extrait/rituel_elegance_site_complet_android/lib/main.dart

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generer projet Android
        working-directory: extrait/rituel_elegance_site_complet_android
        run: flutter create --project-name rituel_elegance --org fr.rituelelegance --platforms android .

      - name: Conserver l'identifiant Android existant
        working-directory: extrait/rituel_elegance_site_complet_android
        run: python3 scripts/prepare_android.py --package fr.rituelelegance.boutique

      - name: Appliquer code 0.3.0 paiements physiques
        run: python3 release/prepare_v03.py

      - name: Installer dependances
        working-directory: extrait/rituel_elegance_site_complet_android
        run: flutter pub get

      - name: Preparer icone d'application
        working-directory: extrait/rituel_elegance_site_complet_android
        run: dart run flutter_launcher_icons

      - name: Compiler AAB release version 3
        working-directory: extrait/rituel_elegance_site_complet_android
        run: flutter build appbundle --release

      - name: Publier AAB a signer localement
        uses: actions/upload-artifact@v4
        with:
          name: Rituel-Elegance-0.3.0-AAB-a-signer
          path: extrait/rituel_elegance_site_complet_android/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
